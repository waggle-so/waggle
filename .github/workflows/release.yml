name: Release

# A merge to main makes a release, after CI passes on that commit
# (docs/decisions/2026-11-10-release-on-merge.md). Every merge bumps the patch; the PR label
# release:minor or release:major bumps more, and skip-release makes no release.
# The keys live in the "release" environment, which only main can use (docs/RELEASE.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only a green CI run for a push to main in this repo. A fork PR from a branch named main
    # also reports head_branch main, so check the event and the repository too.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          # A newer merge has its own CI run and releases itself. Release only the tip of main.
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "main moved past $HEAD_SHA; the newer run releases it."
            echo "version=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0] // empty')"
          LABELS=""
          if [ -n "$PR" ]; then LABELS="$(jq -r '[.labels[].name] | join(",")' <<<"$PR")"; fi
          VERSION="$(bun scripts/lib/next-version.mjs "$(jq -r .version daemon/package.json)" "$LABELS")"
          echo "labels: ${LABELS:-none} -> $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "skip" ]; then exit 0; fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "error: tag v$VERSION already exists." >&2; exit 1
          fi
          # Fail in a minute, not after a 60-minute build, when the release is already out.
          if gh release view "v$VERSION" --repo limone-eth/waggle-releases >/dev/null 2>&1; then
            echo "error: release v$VERSION already exists in waggle-releases. Set main to $VERSION and tag it." >&2; exit 1
          fi
          # Notes: docs/release-notes/<version>.md wins (release.sh reads it); else the PR title.
          if [ ! -f "docs/release-notes/$VERSION.md" ]; then
            if [ -n "$PR" ]; then
              jq -r '"- \(.title) (#\(.number))"' <<<"$PR" > "$RUNNER_TEMP/notes.md"
            else
              git log -1 --pretty=format:'- %s' > "$RUNNER_TEMP/notes.md"
            fi
            echo "notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi

      # release.sh compiles the daemon (bun run build:release), which needs its packages.
      - if: steps.plan.outputs.version != 'skip'
        name: Install daemon packages
        working-directory: daemon
        run: bun install --frozen-lockfile

      - if: steps.plan.outputs.version != 'skip'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Keys
        if: steps.plan.outputs.version != 'skip'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          base64 --decode <<<"$P12_BASE64" > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/devid.p12"
          base64 --decode <<<"$NOTARY_KEY_BASE64" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials waggle-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KC"
          rm -f "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"
          security find-identity -v -p codesigning "$KC" | grep -q 'Developer ID Application' \
            || { echo "error: no Developer ID Application identity in the keychain" >&2; exit 1; }

      - name: Release
        if: steps.plan.outputs.version != 'skip'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NOTES: ${{ steps.plan.outputs.notes }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898289+github-actions[bot]@users.noreply.github.com"
          ARGS=("$VERSION" --ed-key-file "$RUNNER_TEMP/sparkle.key")
          if [ -n "$NOTES" ]; then ARGS+=(--notes "$NOTES"); fi
          bash scripts/release.sh "${ARGS[@]}"
          # release.sh leaves the bump uncommitted and tags the merge commit. Commit the bump
          # with [skip ci] so it starts no CI run and so no second release.
          git add daemon/package.json apps/macos/Resources/BuildNumber
          git commit -m "Release v$VERSION [skip ci]"
          # Push the tag first. It marks this version as released, also when the bump push fails.
          git push origin "v$VERSION"
          # main moves when a PR merges during the build. Rebase the bump onto the new main and
          # push again, so the next run does not compute this version a second time.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "error: could not push the v$VERSION bump to main. Set main to $VERSION by hand." >&2; exit 1

      - name: Clean up keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
