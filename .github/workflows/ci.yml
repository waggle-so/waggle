name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    runs-on: macos-15
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      # A pull request runs the fast tests. A push to main runs every test, with a longer limit per
      # test; the release starts only after that run passes. test/slow-files.txt lists the slow files.
      - name: bun test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bun test --timeout 20000 $(find ./test -name '*.test.ts' | sort | grep -vxF -f test/slow-files.txt)
          else
            bun test --timeout 30000
          fi
      - run: bun run build

  app:
    # The app needs a recent Swift (the release builds use Xcode 27). Swift 6.1 on macos-15 fails on
    # Sendable checks.
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift build
      # One test at a time: in parallel, the WebKit and child-process tests miss
      # their own time limits on a small runner. A pull request skips those suites;
      # a push to main runs them all.
      - name: swift test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            swift test --no-parallel --skip 'PageElementPickTests|PageElementPageCoordinateTests|CommentSurfacesTests|WAG363LoopTests|WAG365LoopTests|CommandRunnerOrderingTests|WebViewCaptureControllerTests'
          else
            swift test --no-parallel
          fi

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The gitleaks binary, not gitleaks-action: the action needs a paid license on org repos.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  signatures:
    # main accepts only signed commits. This fails on the first push of a pull request, not at merge time.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: every commit is signed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          unsigned=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.commit.verification.verified | not) | "\(.sha[0:8]) \(.commit.message | split("\n")[0])"')
          if [ -n "$unsigned" ]; then
            echo "These commits have no verified signature:"
            echo "$unsigned"
            echo
            echo "main accepts only signed commits. Set up signing (CONTRIBUTING.md, Sign your commits), then run:"
            echo "  git rebase --exec 'git commit --amend --no-edit -S' origin/main"
            echo "  git push --force-with-lease"
            exit 1
          fi
          echo "Every commit is signed."
